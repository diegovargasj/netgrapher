[project]
name = "netgrapher"
version = "0.0.1"
description = "Best-effort L3 network topology discovery and interactive graphing from observed traffic"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "diegovargasj", email = "diegovargasj@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "dpkt>=1.9.8",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "typer>=0.12",
    "uvicorn>=0.29",
    "websockets>=12",  # uvicorn's WebSocket support (live UI updates)
]

[project.scripts]
netgrapher = "netgrapher.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",  # FastAPI TestClient
    "hypothesis>=6.100",
    "mypy>=1.10",
    "playwright>=1.40",  # UI smoke tests, run against the system Chromium
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netgrapher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/netgrapher"]

[[tool.mypy.overrides]]
module = ["dpkt.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
